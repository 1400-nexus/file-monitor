[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "file-monitor"
version = "0.1.0"
description = "Nexus TX-side file monitor and transfer planner"
requires-python = ">=3.11"
dependencies = [
    "blake3",
    "inotify-simple",
    "structlog",
    "protobuf",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "hypothesis",
    "mypy",
    "ruff",
    "types-protobuf",
]

[project.scripts]
file-monitor = "file_monitor.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/file_monitor"]

[tool.hatch.build.targets.wheel.force-include]
"libs/nexus-proto/generated/python" = "."

[tool.ruff]
line-length = 100
extend-exclude = ["libs/nexus-proto"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
strict = true
mypy_path = "src"
explicit_package_bases = true
platform = "linux"

[[tool.mypy.overrides]]
module = "inotify_simple"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["common_pb2", "net_pb2", "ipc_pb2"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
