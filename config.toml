[paths]
watch_path = "./watch"
socket_path = "./run/file-monitor.sock"

[pacing]
rate_ceiling_bps = 20000000
rate_floor_bps = 5000000

# fec.k, fec.n, and fec.symbol_bytes are a cross-service contract with the
# C++ sender and receiver. They MUST match exactly on every side — a mismatch
# does not fail loudly, it produces transfers that complete "successfully"
# and write garbage. Do not change these unilaterally.
[fec]
k = 200
n = 255
symbol_bytes = 1400

# sender_count = 0 means "supervise nothing" -- the C++ sender binary lives
# in a different repo and won't exist here until it's built or mounted.
# ProcessSupervisor.run() is then a clean no-op instead of spawn-failing in
# a loop. Raise sender_count once a real binary_path is available.
[senders]
target_host = "127.0.0.1"
base_port = 9000
binary_path = "./bin/nexus-sender"
sender_count = 0
